$kind: http-request
name: Health Check
method: GET
url: '{{baseUrl}}/api/health'
order: 1000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 503", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 503]);
      });
      pm.test("Response has ok field", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("ok");
      });
